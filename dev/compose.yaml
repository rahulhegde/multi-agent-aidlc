name: aidlc-identity
services:
  keycloak:
    # Keycloak 26.7.3, verified amd64 manifest; do not replace with a mutable tag.
    image: quay.io/keycloak/keycloak@sha256:e03b95891c214fba3ab72f12f40c983211549e817c5fce8d0f37761db04ae185
    platform: linux/amd64
    command: [start-dev, --import-realm]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AIDLC_KEYCLOAK_ADMIN_PASSWORD:?Set a local admin password}
      AIDLC_MCP_CLIENT_SECRET: ${AIDLC_MCP_CLIENT_SECRET:?Set a service-account secret}
      AIDLC_PLANNING_CLIENT_SECRET: ${AIDLC_PLANNING_CLIENT_SECRET:?Set a negative-test client secret}
    volumes:
      - ./keycloak/aidlc-realm.json:/opt/keycloak/data/import/aidlc-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    mem_limit: 1g
    cpus: 2
    security_opt:
      - no-new-privileges:true
volumes:
  keycloak-data:
